# 行政查核頁簽 ScrAdmin（響應式・paste-ready）
# 用法：建畫面 ScrAdmin → 全選複製本檔 → 畫布貼上（Cmd/Ctrl+V）
# 手動畫面屬性：Screen.Fill = RGBA(243, 244, 246, 1)
# 資料源：team_member(Excel，名冊)、AttendanceHistory(清單)
#
# 版面：姓名(編號)/Email → 工作時程狀態與同事回覆內容(內嵌小 gallery, 開捲軸)
#       → 現場查核輸入(下拉+儲存) → 出勤狀態(目前實際出勤狀態)
# 名冊用 team_member（避開 GroupBy）；狀態查/寫用 LookUp/UpdateIf。

- conHeaderA:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =84
      Fill: =RGBA(17, 24, 39, 1)
    Children:
      - lblTitleA:
          Control: Label
          Properties:
            Text: |-
              ="行政出勤查核　" & Text(Today(), "yyyy/m/d")
            X: =16
            Y: =12
            Width: =Parent.Width * 0.6
            Height: =32
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(255, 255, 255, 1)
      - lblHintA:
          Control: Label
          Properties:
            Text: ="對照員工回覆，逐人選出勤狀態後按儲存"
            X: =16
            Y: =50
            Width: =Parent.Width * 0.6
            Height: =22
            Size: =12
            Color: =RGBA(209, 213, 219, 1)
      - btnBackA:
          Control: Classic/Button
          Properties:
            Text: ="← 我的回覆"
            OnSelect: =Navigate(ScrToday)
            X: =Parent.Width - Parent.Width * 0.32 - 14
            Y: =22
            Width: =Parent.Width * 0.32
            Height: =40
            Fill: =RGBA(31, 41, 55, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(96, 165, 250, 1)
            BorderThickness: =1
            Size: =14

- lblEmptyA:
    Control: Label
    Properties:
      Text: ="查無同事名冊（請確認 team_member 已連接）"
      Visible: =CountRows(galPeople.AllItems) = 0
      X: =16
      Y: =Parent.Height * 0.35
      Width: =Parent.Width - 32
      Height: =60
      Size: =15
      Align: =Align.Center
      Color: =RGBA(107, 114, 128, 1)

- galPeople:
    Control: Gallery
    Variant: Vertical
    Properties:
      Items: |-
        =Sort(team_member, '員工編號')
      X: =0
      Y: =84
      Width: =Parent.Width
      Height: =Parent.Height - 84
      TemplateSize: =304
      TemplatePadding: =8
    Children:
      - recCardA:
          Control: Rectangle
          Properties:
            X: =8
            Y: =4
            Width: =Parent.TemplateWidth - 16
            Height: =292
            Fill: =RGBA(255, 255, 255, 1)
      - lblName:
          Control: Label
          Properties:
            Text: |-
              =ThisItem.'姓名' & "（" & ThisItem.'員工編號' & "）"
            X: =20
            Y: =14
            Width: =Parent.TemplateWidth - 40
            Height: =28
            Size: =17
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(17, 24, 39, 1)
      - lblEmailA:
          Control: Label
          Properties:
            Text: =ThisItem.Email
            X: =20
            Y: =42
            Width: =Parent.TemplateWidth - 40
            Height: =20
            Size: =12
            Color: =RGBA(107, 114, 128, 1)
      - lblDelaysHeader:
          Control: Label
          Properties:
            Text: ="工作時程狀態與同事回覆內容"
            X: =20
            Y: =66
            Width: =Parent.TemplateWidth - 40
            Height: =22
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(37, 99, 235, 1)
      - galDelays:
          Control: Gallery
          Variant: Vertical
          Properties:
            Items: |-
              =Filter(AttendanceHistory, Email = ThisItem.Email && '日期' = Text(Today(), "yyyy/m/d") && !IsBlank('任務名稱'))
            X: =20
            Y: =90
            Width: =Parent.TemplateWidth - 40
            Height: =96
            TemplateSize: =48
            TemplatePadding: =2
            ShowScrollbar: =true
          Children:
            - lblDLine:
                Control: Label
                Properties:
                  Text: |-
                    ="・" & ThisItem.'任務名稱' & "：" & If(IsBlank(ThisItem.'表單回覆'), "（未回覆）", ThisItem.'表單回覆')
                  X: =4
                  Y: =2
                  Width: =Parent.TemplateWidth - 8
                  Height: =42
                  Size: =12
                  Color: =RGBA(55, 65, 81, 1)
      - lblNoDelay:
          Control: Label
          Properties:
            Text: ="（今日無延遲工作）"
            Visible: =CountRows(galDelays.AllItems) = 0
            X: =20
            Y: =96
            Width: =Parent.TemplateWidth - 40
            Height: =24
            Size: =12
            Color: =RGBA(107, 114, 128, 1)
      - lblScrHeader:
          Control: Label
          Properties:
            Text: ="現場查核輸入"
            X: =20
            Y: =194
            Width: =Parent.TemplateWidth - 40
            Height: =22
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(37, 99, 235, 1)
      - drpStatus:
          Control: Classic/DropDown
          Properties:
            Items: |-
              =["0930已到", "1000已到", "10:00前已發**", "1000未到，已提醒", "1000未到，已發米米信", "1000未到，請假", "異地(其他縣市)", "已發**先去場館後進公司", "當日休假", "臨時請假"]
            Default: |-
              =LookUp(AttendanceHistory, Email = ThisItem.Email && '日期' = Text(Today(), "yyyy/m/d")).'實際出勤狀態'
            X: =20
            Y: =218
            Width: =Parent.TemplateWidth - 150
            Height: =44
            Size: =13
      - btnSaveStatus:
          Control: Classic/Button
          Properties:
            Text: ="儲存"
            OnSelect: |-
              =UpdateIf(
                  AttendanceHistory,
                  Email = ThisItem.Email && '日期' = Text(Today(), "yyyy/m/d"),
                  {'實際出勤狀態': drpStatus.Selected.Value}
              );
              If(
                  IsEmpty(Errors(AttendanceHistory)),
                  Notify("已更新 " & ThisItem.'姓名' & " 的出勤狀態", NotificationType.Success),
                  Notify("更新失敗：" & First(Errors(AttendanceHistory)).Message, NotificationType.Error)
              )
            X: =Parent.TemplateWidth - 124
            Y: =218
            Width: =104
            Height: =44
            Fill: =RGBA(37, 99, 235, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =14
      - lblCurStatus:
          Control: Label
          Properties:
            Text: |-
              ="出勤狀態：" & Coalesce(
                  LookUp(AttendanceHistory, Email = ThisItem.Email && '日期' = Text(Today(), "yyyy/m/d")).'實際出勤狀態',
                  "（未設定）"
              )
            X: =20
            Y: =268
            Width: =Parent.TemplateWidth - 40
            Height: =22
            Size: =13
            Color: =RGBA(37, 99, 235, 1)
