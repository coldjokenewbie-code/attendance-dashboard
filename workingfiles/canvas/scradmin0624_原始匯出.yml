- conHeaderA:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(18, 65, 110, 1)
      Height: =84
      Width: =Parent.Width
    Children:
      - lblTitleA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =20
            Text: ="行政出勤查核　" & Text(Today(), "yyyy/m/d")
            Width: =Parent.Width * 0.6
            X: =16
            Y: =12
      - lblHintA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(209, 213, 219, 1)
            Height: =22
            Size: =12
            Text: ="對照員工回覆，逐人選出勤狀態後按儲存"
            Width: =Parent.Width * 0.6
            X: =16
            Y: =50
      - btnBackA:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(51, 51, 51, 1)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 134, 208, 1)
            OnSelect: =Navigate(ScrToday)
            Size: =14
            Text: ="← 個人時程回覆"
            Width: =Parent.Width * 0.32
            X: =Parent.Width - Parent.Width * 0.32 - 14
            Y: =22
- lblEmptyA:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =RGBA(107, 114, 128, 1)
      Height: =60
      Size: =15
      Text: ="查無同事名冊（請確認 team_member 已連接）"
      Visible: =CountRows(galPeople.AllItems) = 0
      Width: =Parent.Width - 32
      X: =16
      Y: =Parent.Height * 0.35
- galPeople:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Height: =Parent.Height - 84
      Items: =Sort(team_member, 員工編號)
      TemplatePadding: =8
      TemplateSize: =304
      Width: =Parent.Width
      Y: =84
    Children:
      - recCardA:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =292
            Width: =Parent.TemplateWidth - 16
            X: =8
            Y: =4
      - lblName:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(17, 24, 39, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =17
            Text: =ThisItem.姓名 & "（" & ThisItem.員工編號 & "）"
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =14
      - lblEmailA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            Height: =20
            Size: =12
            Text: =ThisItem.Email
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =42
      - lblDelaysHeader:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(150, 111, 92, 1)
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="工作時程狀態與同事回覆內容"
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =66
      - galDelays:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =96
            Items: =Filter(AttendanceHistory, Email = ThisItem.Email && 日期 = Text(Today(), "yyyy/m/d") && !IsBlank(任務名稱))
            TemplatePadding: =2
            TemplateSize: =48
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =90
          Children:
            - lblDLine:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(55, 65, 81, 1)
                  Height: =42
                  Size: =12
                  Text: ="・" & ThisItem.任務名稱 & "：" & If(IsBlank(ThisItem.表單回覆), "（未回覆）", ThisItem.表單回覆)
                  Width: =Parent.TemplateWidth - 8
                  X: =4
                  Y: =2
      - lblNoDelay:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            Height: =24
            Size: =12
            Text: ="（今日無延遲工作）"
            Visible: =CountRows(galDelays.AllItems) = 0
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =96
      - lblScrHeader:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(150, 111, 92, 1)
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="現場查核輸入"
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =194
      - drpStatus:
          Control: Classic/DropDown@2.3.1
          Properties:
            Default: =LookUp(AttendanceHistory, Email = ThisItem.Email && 日期 = Text(Today(), "yyyy/m/d")).實際出勤狀態
            Height: =44
            Items: =["（待確認）", "0930已到", "1000已到", "10:00前已發**", "1000未到，已提醒", "1000未到，已發米米信", "1000未到，請假", "異地(其他縣市)", "已發**先去場館後進公司", "當日休假", "臨時請假"]
            Items.Value: =Value
            Width: =Parent.TemplateWidth - 150
            X: =20
            Y: =218
      - btnSaveStatus:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 134, 208, 1)
            Height: =44
            OnSelect: |-
              =UpdateIf(
                  AttendanceHistory,
                  Email = ThisItem.Email && 日期 = Text(Today(), "yyyy/m/d"),
                  {實際出勤狀態: drpStatus.Selected.Value}
              );
              If(
                  IsEmpty(Errors(AttendanceHistory)),
                  Notify("已更新 " & ThisItem.姓名 & " 的出勤狀態", NotificationType.Success),
                  Notify("更新失敗：" & First(Errors(AttendanceHistory)).Message, NotificationType.Error)
              )
            Size: =14
            Text: ="儲存"
            Width: =104
            X: =Parent.TemplateWidth - 124
            Y: =218
      - lblCurStatus:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(150, 111, 92, 1)
            Height: =22
            Text: |-
              ="出勤狀態：" & Coalesce(
                  LookUp(AttendanceHistory, Email = ThisItem.Email && 日期 = Text(Today(), "yyyy/m/d")).實際出勤狀態,
                  "（待確認）"
              )
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =268
