# 模組一 — 今日出勤查核（一般同事頁・響應式・paste-ready）
# 用法：建畫面 ScrToday → 全選複製本檔 → 畫布貼上（Cmd/Ctrl+V）
# 手動畫面屬性：
#   Screen.Fill      = RGBA(243, 244, 246, 1)
#   Screen.OnVisible = UpdateContext({locShowPopup: false, locIsAdmin: !IsBlank(LookUp(team_member, Email = User().Email, '出勤存取權限'))})
#   （locIsAdmin：判斷是否行政；供 10:00 後回覆唯讀鎖用，行政不受鎖。UI 鎖非硬安全，見 變更_回覆10點後唯讀.html）
# 資料源：AttendanceHistory(清單)、team_member(Excel，判行政權限)
# 只顯示「今日、本人、有延遲任務」的列；占位列(任務名稱空白)濾掉。

- conHeader:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =100
      Fill: =RGBA(31, 41, 55, 1)
    Children:
      - lblTitle:
          Control: Label
          Properties:
            Text: |-
              ="今日出勤查核　" & Text(Today(), "yyyy/m/d")
            X: =16
            Y: =12
            Width: =Parent.Width * 0.62
            Height: =34
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(255, 255, 255, 1)
      - lblUser:
          Control: Label
          Properties:
            Text: |-
              =User().FullName & "　" & User().Email
            X: =16
            Y: =50
            Width: =Parent.Width * 0.62
            Height: =24
            Size: =13
            Color: =RGBA(209, 213, 219, 1)
      - btnAdmin:
          Control: Classic/Button
          Properties:
            Text: ="行政查核"
            Visible: |-
              =!IsBlank(LookUp(team_member, Email = User().Email, '出勤存取權限'))
            OnSelect: =Navigate(ScrAdmin)
            X: =Parent.Width - Parent.Width * 0.28 - 14
            Y: =32
            Width: =Parent.Width * 0.28
            Height: =40
            Fill: =RGBA(180, 83, 9, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =15

- lblEmpty:
    Control: Label
    Properties:
      Text: ="今天沒有需要回覆的延遲工作"
      Visible: =CountRows(galToday.AllItems) = 0
      X: =16
      Y: =Parent.Height * 0.35
      Width: =Parent.Width - 32
      Height: =60
      Size: =16
      Align: =Align.Center
      Color: =RGBA(107, 114, 128, 1)

- galToday:
    Control: Gallery
    Variant: Vertical
    Properties:
      Items: |-
        =Filter(
            AttendanceHistory,
            Email = User().Email,
            '日期' = Text(Today(), "yyyy/m/d"),
            !IsBlank('任務名稱')
        )
      X: =0
      Y: =100
      Width: =Parent.Width
      Height: =Parent.Height - 100
      TemplateSize: =280
      TemplatePadding: =6
    Children:
      - recCard:
          Control: Rectangle
          Properties:
            X: =8
            Y: =4
            Width: =Parent.TemplateWidth - 16
            Height: =268
            Fill: =RGBA(255, 255, 255, 1)
      - lblPlan:
          Control: Label
          Properties:
            Text: |-
              ="【專案】" & ThisItem.'方案名稱'
            X: =20
            Y: =16
            Width: =Parent.TemplateWidth - 40
            Height: =28
            Size: =17
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(17, 24, 39, 1)
      - lblTask:
          Control: Label
          Properties:
            Text: |-
              ="【工作】" & ThisItem.'任務名稱'
            X: =20
            Y: =46
            Width: =Parent.TemplateWidth - 40
            Height: =26
            Size: =14
            Color: =RGBA(55, 65, 81, 1)
      - lblReplyHeader:
          Control: Label
          Properties:
            Text: ="【工作延遲回覆（請勾選）】"
            X: =20
            Y: =78
            Width: =Parent.TemplateWidth - 40
            Height: =22
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(37, 99, 235, 1)
      - lblReplyVal:
          Control: Label
          Properties:
            Text: |-
              =If(IsBlank(ThisItem.'表單回覆'), "（未回覆）", ThisItem.'表單回覆')
            X: =34
            Y: =102
            Width: =Parent.TemplateWidth - 54
            Height: =30
            Size: =15
            Color: =If(IsBlank(ThisItem.'表單回覆'), RGBA(220, 38, 38, 1), RGBA(22, 101, 52, 1))
      - lblStatusHeader:
          Control: Label
          Properties:
            Text: ="【實際出勤狀態（米米信/行政人員填寫）】"
            X: =20
            Y: =136
            Width: =Parent.TemplateWidth - 40
            Height: =22
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(75, 85, 99, 1)
      - lblStatusVal:
          Control: Label
          Properties:
            Text: |-
              =If(IsBlank(ThisItem.'實際出勤狀態'), "（未填）", ThisItem.'實際出勤狀態')
            X: =34
            Y: =160
            Width: =Parent.TemplateWidth - 54
            Height: =46
            Size: =14
            Color: =RGBA(75, 85, 99, 1)
      - btnReply:
          Control: Classic/Button
          Properties:
            Text: ="填寫回覆"
            OnSelect: |-
              =UpdateContext({locSelected: ThisItem, locShowPopup: true});
              Reset(radReply)
            X: =20
            Y: =214
            Width: =Parent.TemplateWidth - 40
            Height: =46
            Fill: =RGBA(37, 99, 235, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =16

- conOverlay:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =RGBA(0, 0, 0, 0.45)
      Visible: =locShowPopup
    Children:
      - conPopup:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
            Width: =Min(Parent.Width - 24, 560)
            Height: =Min(Parent.Height - 64, 580)
            Fill: =RGBA(255, 255, 255, 1)
          Children:
            - lblPopTitle:
                Control: Label
                Properties:
                  Text: ="填寫工作延遲回覆"
                  X: =20
                  Y: =16
                  Width: =Parent.Width - 40
                  Height: =32
                  Size: =19
                  FontWeight: =FontWeight.Semibold
            - lblPopMeta:
                Control: Label
                Properties:
                  Text: |-
                    ="【專案】" & locSelected.'方案名稱' & Char(10) &
                     "【工作】" & locSelected.'任務名稱'
                  X: =20
                  Y: =52
                  Width: =Parent.Width - 40
                  Height: =72
                  Size: =14
                  Color: =RGBA(75, 85, 99, 1)
            - radReply:
                Control: Classic/Radio
                Properties:
                  Items: |-
                    =["1. 已完成（請自行勾掉卡片）", "2. 延遲（09:30已到公司在補進度）", "3. 延遲（09:30沒到公司，請填寫假卡）", "4. 如為其他狀況，請於5分鐘內更新卡片"]
                  Default: |-
                    =locSelected.'表單回覆'
                  Layout: =Layout.Vertical
                  X: =20
                  Y: =132
                  Width: =Parent.Width - 40
                  Height: =Parent.Height - 132 - 72
                  Size: =15
                  # 10:00 後一般同事唯讀（行政 locIsAdmin 不受鎖）。UI 鎖非硬安全。
                  DisplayMode: |-
                    =If(locIsAdmin Or Hour(Now()) < 10, DisplayMode.Edit, DisplayMode.View)
            - btnCancel:
                Control: Classic/Button
                Properties:
                  Text: ="取消"
                  OnSelect: |-
                    =UpdateContext({locShowPopup: false})
                  X: =20
                  Y: =Parent.Height - 58
                  Width: =(Parent.Width - 48) / 2
                  Height: =46
                  Fill: =RGBA(229, 231, 235, 1)
                  Color: =RGBA(31, 41, 55, 1)
                  Size: =15
            - btnSubmit:
                Control: Classic/Button
                Properties:
                  Text: ="送出"
                  # 同一時間/行政判斷也加在 OnSelect：DisplayMode 只擋畫面、Patch 仍須自衛（Codex F）
                  OnSelect: |-
                    =If(
                        !(locIsAdmin Or Hour(Now()) < 10),
                        Notify("10:00 後僅行政人員可修改回覆", NotificationType.Error),
                        Patch(AttendanceHistory, locSelected, {'表單回覆': radReply.Selected.Value});
                        If(
                            IsEmpty(Errors(AttendanceHistory, locSelected)),
                            Notify("已送出回覆", NotificationType.Success);
                            UpdateContext({locShowPopup: false}),
                            Notify("送出失敗：" & First(Errors(AttendanceHistory, locSelected)).Message, NotificationType.Error)
                        )
                    )
                  DisplayMode: |-
                    =If(locIsAdmin Or Hour(Now()) < 10, DisplayMode.Edit, DisplayMode.View)
                  X: =Parent.Width - 20 - (Parent.Width - 48) / 2
                  Y: =Parent.Height - 58
                  Width: =(Parent.Width - 48) / 2
                  Height: =46
                  Fill: =RGBA(37, 99, 235, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  Size: =15
