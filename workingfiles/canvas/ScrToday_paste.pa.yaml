# 基準：2026-08-03 使用者從 Studio 匯出的現用版本（ScrToday_0803bak.yml），控件結構未動。
# 手動畫面屬性（Studio 內手動設，此檔貼不出這段，貼上後須確認仍在）：
#   Screen.OnVisible = UpdateContext({locShowPopup: false}); Set(gToday, Text(Today(), "yyyy/mm/dd"))
#   （gToday 為全域變數：Filter 內直接寫 Text(Today()...) 不可委派。日期格式零填補 yyyy/mm/dd，須與清單「日期」欄一致。）
# 用法：畫布全選現有控件 → 刪除 → 貼上本檔（Cmd/Ctrl+V）→ 確認 OnVisible 仍在。
#
# 2026-08-03／08-04 選項文字修訂（radReply.Items）：
#   選項 3：「…，請填寫假卡」→「…，待填寫假卡」
#   選項 2：「…09:30已到公司在補進度」→「…09:30已到公司/場館/會議早加班」（08-04 使用者在 Studio 直接改，此檔同步）
#   全流程與行政頁的判別一律用前綴（1./3./5. 或空白），不比對全文，故改文字不影響任何判定。
#   已知副作用：radReply.Default 綁 locSelected.表單回覆，清單內既有的舊文字不在新 Items 中，
#   重開 Popup 時該筆會顯示未選取（資料仍在，僅圓鈕不亮）。舊值隨每日新資料自然淘汰，不處理。
#
# 2026-08-27 新增（[Claude@Mac]，回應手機端「送出後無法結束程式」）：
#   conHeader 右上角加 btnExit（OnSelect: =Exit()）── 本畫面原本沒有任何 Exit/Back/Navigate，
#   手機播放器只能靠邊緣滑動手勢離開，同事找不到。
#   ※ btnExit 放 Children 最後＝z-order 最上層，Label 擋不住它的點擊，
#     故 lblTitle 寬度「不必」讓位。曾試 -132，手機實測導致標題換兩行、被 Height:=32 裁掉，已還原 -32。
#   ※ 只加單一控件，不要整頁重貼（Studio 端 TemplateSize 可能已被手改，見 TaskLog A11）。
#
# 既有改動（2026-07-28 / 07-31，已上線）：
#   ① galToday.Items 巢狀 Filter ── 內層只留可委派條件（Email／日期），外層本機篩 任務名稱 <> Blank()。
#   ② Popup 與卡片內所有 Label 改 AutoHeight，Y 串接上一個控件的 Y + Height + 間距；
#      TemplateSize 280→420（垂直 Gallery 列高無法逐列自動，取最壞情況固定值）。

- conHeader:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(204, 231, 246, 1)
      Height: =100
      Width: =Parent.Width
    Children:
      - lblTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(31, 41, 55, 1)
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =18
            Text: ="今日工作時程狀況　" & Text(Today(), "yyyy/mm/dd")
            Width: =Parent.Width - 32
            X: =16
            Y: =14
      - lblUser:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(75, 85, 99, 1)
            Height: =22
            Text: =User().FullName
            Width: =Parent.Width - 32
            X: =16
            Y: =48
      - lblUserEmail:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Height: =20
            Size: =11
            Text: =User().Email
            Width: =Parent.Width - 32
            X: =16
            Y: =70
      - recHeaderLine_1:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(229, 231, 235, 1)
            Height: =1
            Width: =Parent.Width
            Y: =99
      - btnExit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(148, 163, 184, 1)
            BorderThickness: =1
            Color: =RGBA(51, 65, 85, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =32
            HoverFill: =RGBA(226, 232, 240, 1)
            OnSelect: =Exit()
            Size: =13
            Text: ="離開 App"
            Tooltip: ="關閉出勤回覆 App，回到 Power Apps 的 app 清單"
            Width: =92
            X: =Parent.Width - 108
            Y: =14
- lblEmpty:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =RGBA(156, 163, 175, 1)
      Height: =60
      Size: =16
      Text: ="今天沒有需要回覆的延遲工作"
      Visible: =CountRows(galToday.AllItems) = 0
      Width: =Parent.Width - 32
      X: =16
      Y: =Parent.Height * 0.35
- galToday:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Height: =Parent.Height - 100
      Items: |-
        =Filter(
            Filter(AttendanceHistory, Email = User().Email, 日期 = gToday),
            任務名稱 <> Blank()
        )
      TemplatePadding: =6
      TemplateSize: =420
      Width: =Parent.Width
      Y: =100
    Children:
      - recCard:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =btnReply.Y + btnReply.Height + 12
            Width: =Parent.TemplateWidth - 16
            X: =8
            Y: =4
      - lblPlan:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Color: =RGBA(31, 41, 55, 1)
            FontWeight: =FontWeight.Semibold
            Size: =17
            Text: ="【專案】" & ThisItem.方案名稱
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =16
      - lblTask:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Color: =RGBA(55, 65, 81, 1)
            Size: =14
            Text: ="【工作】" & ThisItem.任務名稱
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =lblPlan.Y + lblPlan.Height + 4
      - lblReplyHeader:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Text: ="【工作延遲回覆（請勾選）】"
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =lblTask.Y + lblTask.Height + 10
      - lblReplyVal:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Color: =If(IsBlank(ThisItem.表單回覆), RGBA(220, 38, 38, 1), RGBA(22, 101, 52, 1))
            Size: =15
            Text: =If(IsBlank(ThisItem.表單回覆), "（未回覆）", ThisItem.表單回覆)
            Width: =Parent.TemplateWidth - 54
            X: =34
            Y: =lblReplyHeader.Y + lblReplyHeader.Height + 2
      - lblStatusHeader:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Text: ="【實際出勤狀態（米米信/行政人員填寫）】"
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =lblReplyVal.Y + lblReplyVal.Height + 10
      - lblStatusVal:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Color: =RGBA(55, 65, 81, 1)
            Size: =14
            Text: =If(IsBlank(ThisItem.實際出勤狀態), "（未填）", ThisItem.實際出勤狀態)
            Width: =Parent.TemplateWidth - 54
            X: =34
            Y: =lblStatusHeader.Y + lblStatusHeader.Height + 2
      - btnReply:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 121, 187, 1)
            Height: =46
            HoverFill: =RGBA(29, 78, 216, 1)
            OnSelect: |-
              =UpdateContext({locSelected: ThisItem, locShowPopup: true});
              Reset(radReply)
            Size: =16
            Text: ="填寫回覆"
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =lblStatusVal.Y + lblStatusVal.Height + 14
- conOverlay:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(15, 23, 42, 0.4)
      Height: =Parent.Height
      Visible: =locShowPopup
      Width: =Parent.Width
    Children:
      - conPopup:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Min(Parent.Height - 40, 680)
            Width: =Min(Parent.Width - 24, 560)
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
          Children:
            - lblPopTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(31, 41, 55, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =19
                  Text: ="填寫工作延遲回覆"
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =16
            - lblPopMeta:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(107, 114, 128, 1)
                  Text: |-
                    ="【專案】" & locSelected.方案名稱 & Char(10) &
                     "【工作】" & locSelected.任務名稱
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =52
            - radReply:
                Control: Classic/Radio@2.3.0
                Properties:
                  Color: =RGBA(31, 41, 55, 1)
                  Default: =locSelected.表單回覆
                  Height: =Parent.Height - Self.Y - 72
                  Items: =["1. 已完成（請自行勾掉卡片）", "2. 延遲（09:30已到公司/場館/會議早加班）", "3. 延遲（09:30沒到公司，待填寫假卡）", "4. 延遲（09:30沒到公司，當天已請假）", "5. 如為其他狀況，請於5分鐘內更新卡片"]
                  Items.Value: =Value
                  Size: =15
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =lblPopMeta.Y + lblPopMeta.Height + 12
            - btnCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(229, 231, 235, 1)
                  BorderThickness: =1
                  Color: =RGBA(31, 41, 55, 1)
                  Fill: =RGBA(243, 244, 246, 1)
                  Height: =46
                  HoverFill: =RGBA(229, 231, 235, 1)
                  OnSelect: |-
                    =UpdateContext({locShowPopup: false})
                  Text: ="取消"
                  Width: =(Parent.Width - 48) / 2
                  X: =20
                  Y: =Parent.Height - 58
            - btnSubmit:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(37, 99, 235, 1)
                  Height: =46
                  HoverFill: =RGBA(29, 78, 216, 1)
                  OnSelect: |-
                    =Patch(AttendanceHistory, locSelected, {表單回覆: radReply.Selected.Value});
                    If(
                        IsEmpty(Errors(AttendanceHistory, locSelected)),
                        Notify("已送出回覆", NotificationType.Success);
                        UpdateContext({locShowPopup: false}),
                        Notify("送出失敗：" & First(Errors(AttendanceHistory, locSelected)).Message, NotificationType.Error)
                    )
                  Text: ="送出"
                  Width: =(Parent.Width - 48) / 2
                  X: =Parent.Width - 20 - (Parent.Width - 48) / 2
                  Y: =Parent.Height - 58
