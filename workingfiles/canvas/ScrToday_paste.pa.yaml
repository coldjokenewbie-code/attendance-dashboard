# 手動畫面屬性（Studio 內手動設定，此檔案無法貼出這段）：
#   Screen.OnVisible = UpdateContext({locShowPopup: false}); Set(gToday, Text(Today(), "yyyy/mm/dd"))
#   （gToday 為全域變數，避免 Filter 內直接用 Text(Today()...) 造成不可委派；日期格式為零填補 yyyy/mm/dd，須與清單「日期」欄格式一致）
# 用法：畫布全選現有控件 → 刪除 → 貼上本檔（Cmd/Ctrl+V）→ 回 Studio 手動加上方 OnVisible
# 基準：2026-07-06 從 Studio 匯出的最新內容；本次改動＝拆分個人/行政：移除「行政查核」鈕(btnAdmin, Navigate(ScrAdmin))，
#   頭部標題與使用者資訊改全寬（原標題 Width 0.62 為讓位按鈕，在窄手機換行與姓名重疊），姓名/email 分兩行。行政查核改獨立 app/服務。

- conHeader:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(204, 231, 246, 1)
      Height: =100
      Width: =Parent.Width
    Children:
      - lblTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(31, 41, 55, 1)
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =18
            Text: ="今日出勤查核　" & Text(Today(), "yyyy/mm/dd")
            Width: =Parent.Width - 32
            X: =16
            Y: =14
      - lblUser:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(75, 85, 99, 1)
            Height: =22
            Size: =13
            Text: =User().FullName
            Width: =Parent.Width - 32
            X: =16
            Y: =48
      - lblUserEmail:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Height: =20
            Size: =11
            Text: =User().Email
            Width: =Parent.Width - 32
            X: =16
            Y: =70
      - recHeaderLine_1:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(229, 231, 235, 1)
            Height: =1
            Width: =Parent.Width
            Y: =99
- lblEmpty:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =RGBA(156, 163, 175, 1)
      Height: =60
      Size: =16
      Text: ="今天沒有需要回覆的延遲工作"
      Visible: =CountRows(galToday.AllItems) = 0
      Width: =Parent.Width - 32
      X: =16
      Y: =Parent.Height * 0.35
- galToday:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Height: =Parent.Height - 100
      Items: |-
        =Filter(
            AttendanceHistory,
            Email = User().Email,
            日期 = gToday,
            任務名稱 <> Blank()
        )
      TemplatePadding: =6
      TemplateSize: =280
      Width: =Parent.Width
      Y: =100
    Children:
      - recCard:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =268
            Width: =Parent.TemplateWidth - 16
            X: =8
            Y: =4
      - lblPlan:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(31, 41, 55, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =17
            Text: ="【專案】" & ThisItem.方案名稱
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =16
      - lblTask:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(55, 65, 81, 1)
            Height: =26
            Size: =14
            Text: ="【工作】" & ThisItem.任務名稱
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =46
      - lblReplyHeader:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="【工作延遲回覆（請勾選）】"
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =78
      - lblReplyVal:
          Control: Label@2.5.1
          Properties:
            Color: =If(IsBlank(ThisItem.表單回覆), RGBA(220, 38, 38, 1), RGBA(22, 101, 52, 1))
            Height: =30
            Size: =15
            Text: =If(IsBlank(ThisItem.表單回覆), "（未回覆）", ThisItem.表單回覆)
            Width: =Parent.TemplateWidth - 54
            X: =34
            Y: =102
      - lblStatusHeader:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="【實際出勤狀態（米米信/行政人員填寫）】"
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =136
      - lblStatusVal:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(55, 65, 81, 1)
            Height: =46
            Size: =14
            Text: =If(IsBlank(ThisItem.實際出勤狀態), "（未填）", ThisItem.實際出勤狀態)
            Width: =Parent.TemplateWidth - 54
            X: =34
            Y: =160
      - btnReply:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 121, 187, 1)
            Height: =46
            HoverFill: =RGBA(29, 78, 216, 1)
            OnSelect: |-
              =UpdateContext({locSelected: ThisItem, locShowPopup: true});
              Reset(radReply)
            Size: =16
            Text: ="填寫回覆"
            Width: =Parent.TemplateWidth - 40
            X: =20
            Y: =214
- conOverlay:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(15, 23, 42, 0.4)
      Height: =Parent.Height
      Visible: =locShowPopup
      Width: =Parent.Width
    Children:
      - conPopup:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Min(Parent.Height - 64, 580)
            Width: =Min(Parent.Width - 24, 560)
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
          Children:
            - lblPopTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(31, 41, 55, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =19
                  Text: ="填寫工作延遲回覆"
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =16
            - lblPopMeta:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(107, 114, 128, 1)
                  Height: =72
                  Size: =14
                  Text: |-
                    ="【專案】" & locSelected.方案名稱 & Char(10) &
                     "【工作】" & locSelected.任務名稱
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =52
            - radReply:
                Control: Classic/Radio@2.3.0
                Properties:
                  Color: =RGBA(31, 41, 55, 1)
                  Default: =locSelected.表單回覆
                  Height: =Parent.Height - 132 - 72
                  Items: =["1. 已完成（請自行勾掉卡片）", "2. 延遲（09:30已到公司在補進度）", "3. 延遲（09:30沒到公司，請填寫假卡）", "4. 延遲（09:30沒到公司，當天已請假）", "5. 如為其他狀況，請於5分鐘內更新卡片"]
                  Items.Value: =Value
                  Size: =15
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =132
            - btnCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(229, 231, 235, 1)
                  BorderThickness: =1
                  Color: =RGBA(31, 41, 55, 1)
                  Fill: =RGBA(243, 244, 246, 1)
                  Height: =46
                  HoverFill: =RGBA(229, 231, 235, 1)
                  OnSelect: |-
                    =UpdateContext({locShowPopup: false})
                  Text: ="取消"
                  Width: =(Parent.Width - 48) / 2
                  X: =20
                  Y: =Parent.Height - 58
            - btnSubmit:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(37, 99, 235, 1)
                  Height: =46
                  HoverFill: =RGBA(29, 78, 216, 1)
                  OnSelect: |-
                    =Patch(AttendanceHistory, locSelected, {表單回覆: radReply.Selected.Value});
                    If(
                        IsEmpty(Errors(AttendanceHistory, locSelected)),
                        Notify("已送出回覆", NotificationType.Success);
                        UpdateContext({locShowPopup: false}),
                        Notify("送出失敗：" & First(Errors(AttendanceHistory, locSelected)).Message, NotificationType.Error)
                    )
                  Text: ="送出"
                  Width: =(Parent.Width - 48) / 2
                  X: =Parent.Width - 20 - (Parent.Width - 48) / 2
                  Y: =Parent.Height - 58
