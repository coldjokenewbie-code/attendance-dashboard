- conHeaderA:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Height: =84
      Width: =Parent.Width
    Children:
      - lblTitleA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(31, 41, 55, 1)
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =18
            Text: ="行政出勤查核　" & Text(Today(), "yyyy/m/d")
            Width: =Parent.Width * 0.6
            X: =16
            Y: =12
      - lblHintA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Height: =22
            Size: =12
            Text: ="對照同事回覆，選下拉或打字輸入狀態即自動儲存"
            Width: =Parent.Width * 0.6
            X: =16
            Y: =50
      - btnBackA:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Color: =RGBA(37, 99, 235, 1)
            Fill: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(248, 250, 252, 1)
            OnSelect: =Navigate(ScrToday)
            Size: =13
            Text: ="← 個人時程回覆"
            Width: =Parent.Width * 0.32
            X: =Parent.Width - Parent.Width * 0.32 - 14
            Y: =24
      - recHeaderLine:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(229, 231, 235, 1)
            Height: =1
            Width: =Parent.Width
            X: =0
            Y: =83
- conColHead:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Height: =32
      Width: =Parent.Width
      Y: =84
    Children:
      - lblColPerson:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="同事（編號）"
            Width: =Parent.Width * 0.19
            X: =Parent.Width * 0.02
            Y: =7
      - lblColReply:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="工作時程狀態與同事回覆"
            Width: =Parent.Width * 0.45
            X: =Parent.Width * 0.22
            Y: =7
      - lblColStatus:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="出勤狀態（下拉選或打字，即存）"
            Width: =Parent.Width * 0.29
            X: =Parent.Width * 0.69
            Y: =7
      - recColLine:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(229, 231, 235, 1)
            Height: =1
            Width: =Parent.Width
            X: =0
            Y: =31
- lblEmptyA:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =RGBA(156, 163, 175, 1)
      Height: =60
      Size: =15
      Text: ="查無同事名冊（請確認 team_member 已連接）"
      Visible: =CountRows(galPeople.AllItems) = 0
      Width: =Parent.Width - 32
      X: =16
      Y: =Parent.Height * 0.35
- galPeople:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Height: =Parent.Height - 116
      Items: |-
        =AddColumns(
            Sort(team_member, 員工編號) As tm,
            CurStatus,
            LookUp(AttendanceHistory, Email = tm.Email && 日期 = Text(Today(), "yyyy/m/d")).實際出勤狀態
        )
      TemplatePadding: =0
      TemplateSize: =108
      Width: =Parent.Width
      Y: =116
    Children:
      - recRow:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.TemplateHeight
            Width: =Parent.TemplateWidth
            X: =0
            Y: =0
      - recDivider:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(241, 245, 249, 1)
            Height: =1
            Width: =Parent.TemplateWidth
            X: =0
            Y: =Parent.TemplateHeight - 1
      - lblName:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(31, 41, 55, 1)
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =14
            Text: =ThisItem.姓名 & "（" & ThisItem.員工編號 & "）"
            Width: =Parent.TemplateWidth * 0.19
            X: =Parent.TemplateWidth * 0.02
            Y: =12
      - lblEmailA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Height: =18
            Size: =10
            Text: =ThisItem.Email
            Width: =Parent.TemplateWidth * 0.19
            X: =Parent.TemplateWidth * 0.02
            Y: =38
      - lblReply:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(75, 85, 99, 1)
            Height: =Parent.TemplateHeight - 16
            Size: =12
            Text: |-
              =With(
                  {d: Filter(AttendanceHistory, Email = ThisItem.Email && 日期 = Text(Today(), "yyyy/m/d") && !IsBlank(任務名稱))},
                  If(
                      CountRows(d) = 0,
                      "（今日無延遲工作）",
                      Concat(d, "・" & 任務名稱 & "：" & If(IsBlank(表單回覆), "（未回覆）", 表單回覆), Char(10))
                  )
              )
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth * 0.45
            X: =Parent.TemplateWidth * 0.22
            Y: =8
      - lblStatusBadge:
          Control: Label@2.5.1
          Properties:
            Color: =If(!IsBlank(ThisItem.CurStatus) && ThisItem.CurStatus <> "（待確認）", RGBA(15, 23, 42, 1), RGBA(203, 213, 225, 1))
            FontWeight: =If(!IsBlank(ThisItem.CurStatus) && ThisItem.CurStatus <> "（待確認）", FontWeight.Bold, FontWeight.Normal)
            Height: =26
            Size: =If(!IsBlank(ThisItem.CurStatus) && ThisItem.CurStatus <> "（待確認）", 15, 12)
            Text: =If(!IsBlank(ThisItem.CurStatus) && ThisItem.CurStatus <> "（待確認）", ThisItem.CurStatus, "待確認")
            Width: =Parent.TemplateWidth * 0.29
            X: =Parent.TemplateWidth * 0.69
            Y: =10
      - drpStatus:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            Color: =If(Self.Selected.Value = "（待確認）", RGBA(203, 213, 225, 1), RGBA(31, 41, 55, 1))
            Default: =Coalesce(ThisItem.CurStatus, "（待確認）")
            Fill: =RGBA(255, 255, 255, 1)
            Height: =34
            Items: =["（待確認）", "0930已到", "1000已到", "10:00前已發**", "1000未到，已提醒", "1000未到，已發米米信", "1000未到，請假", "異地(其他縣市)", "已發**先去場館後進公司", "當日休假", "臨時請假"]
            Items.Value: =Value
            OnChange: |-
              =If(
                  !IsBlank(Self.Selected.Value)
                      && Self.Selected.Value <> "（待確認）"
                      && Self.Selected.Value <> Coalesce(ThisItem.CurStatus, ""),
                  UpdateIf(
                      AttendanceHistory,
                      Email = ThisItem.Email && 日期 = Text(Today(), "yyyy/m/d"),
                      {實際出勤狀態: Self.Selected.Value}
                  );
                  If(
                      IsEmpty(Errors(AttendanceHistory)),
                      Notify("已更新 " & ThisItem.姓名 & "：" & Self.Selected.Value, NotificationType.Success),
                      Notify("更新失敗：" & First(Errors(AttendanceHistory)).Message, NotificationType.Error)
                  )
              )
            Width: =Parent.TemplateWidth * 0.29
            X: =Parent.TemplateWidth * 0.69
            Y: =42
      - txtNote:
          Control: Classic/TextInput@2.3.1
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            Color: =RGBA(31, 41, 55, 1)
            Default: |-
              =If(
                  !IsBlank(ThisItem.CurStatus)
                      && IsBlank(LookUp(["（待確認）", "0930已到", "1000已到", "10:00前已發**", "1000未到，已提醒", "1000未到，已發米米信", "1000未到，請假", "異地(其他縣市)", "已發**先去場館後進公司", "當日休假", "臨時請假"], Value = ThisItem.CurStatus)),
                  ThisItem.CurStatus,
                  ""
              )
            Fill: =RGBA(255, 255, 255, 1)
            HintText: ="或直接打字輸入自訂狀態"
            Height: =32
            OnChange: |-
              =If(
                  !IsBlank(Self.Text)
                      && Self.Text <> Coalesce(ThisItem.CurStatus, ""),
                  UpdateIf(
                      AttendanceHistory,
                      Email = ThisItem.Email && 日期 = Text(Today(), "yyyy/m/d"),
                      {實際出勤狀態: Self.Text}
                  );
                  If(
                      IsEmpty(Errors(AttendanceHistory)),
                      Notify("已更新 " & ThisItem.姓名 & "：" & Self.Text, NotificationType.Success),
                      Notify("更新失敗：" & First(Errors(AttendanceHistory)).Message, NotificationType.Error)
                  )
              )
            Size: =12
            Width: =Parent.TemplateWidth * 0.29
            X: =Parent.TemplateWidth * 0.69
            Y: =76
