      - lblColReply:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="工作時程狀態｜同事回覆"
            Width: =Parent.Width * 0.465
            X: =Parent.Width * 0.525
