          Properties:
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =8
            Text: ="編號"
            Width: =Parent.Width * 0.04
            X: =Parent.Width * 0.008
            Y: =7
      - lblColPerson:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="同事"
            Width: =Parent.Width * 0.07
            X: =Parent.Width * 0.05
            Y: =7
      - lblColStatus:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="出勤狀態（已存）"
            Width: =Parent.Width * 0.125
            X: =Parent.Width * 0.125
            Y: =7
      - lblColInput:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
