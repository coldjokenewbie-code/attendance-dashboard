# 手動畫面屬性（Studio 內手動設定，此檔案無法貼出這段）：
#   Screen.OnVisible = Set(gToday, Text(Today(), "yyyy/mm/dd")); ClearCollect(colToday, Filter(AttendanceHistory, 日期 = gToday))
#   （gToday 全域；colToday＝今日出勤快照本機集合，鏡像 SharePoint；日期零填補 yyyy/mm/dd 須與清單一致）
# 用法：畫布全選現有控件 → 刪除 → 貼上本檔（Cmd/Ctrl+V）→ 回 Studio 手動設上方 OnVisible
# ★獨立行政查核 app（與個人時程 ScrToday 拆開）：
#   - 已移除「← 個人時程回覆」鈕（Navigate(ScrToday) 在獨立 app 無此畫面會壞），頂部僅「↻ 重新整理」一鈕。
#   - 新 app 需連兩個資料來源：SharePoint 清單 AttendanceHistory、Excel 表 team_member（否則 galPeople 抓不到名冊、寫入會失敗）。
#   - App→設定→顯示：方向「橫向」、關「縮放至適合大小」以填滿桌機寬（行政人員用電腦）。
# 版面（寬螢幕，左側三欄收窄貼緊消除空白）：①編號(最左,6pt,W0.04) ②同事姓名(W0.07) ③出勤狀態(粗體藍,緊接姓名,W0.125) ④行政人員輸入(下拉+自訂) ⑤工作時程狀態｜同事回覆
#   列高響應式 TemplateSize=(Parent.Height-116)/25；控件高度/Y 相對 Parent.TemplateHeight；編號 6pt、其餘最小 10pt。
#   橫向防看錯人三保險：①左三欄貼緊 ②列交替底色(白/淡藍灰，Items 用 Sequence 加 Idx、recRow.Fill 依 Mod(Idx,2)) ③每列底部分隔線 recDivider。
# ★藍字＝已確認存檔：col③讀 colToday 的 CurStatus，僅「SharePoint 寫入成功後」才更新 colToday→才變藍；col④為輸入區，寫入前 col③不變藍避免誤判。
#   實測：SharePoint 連接器確認寫入約 1–2 秒；要即時且確認請改用清單快速編輯。
#   註：Items 的 Sequence/Index/Patch 需現代版 Power Apps；若 zebra 無效，仍有 recDivider 分列；要移除 zebra 就把 Items 改回單純 AddColumns、recRow.Fill 改 =RGBA(255,255,255,1)。

- conHeaderA:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(237, 237, 237, 1)
      Height: =84
      Width: =Parent.Width
    Children:
      - lblTitleA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(31, 41, 55, 1)
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =18
            Text: ="行政出勤查核　" & Text(Today(), "yyyy/mm/dd")
            Width: =Parent.Width * 0.46
            X: =16
            Y: =12
      - lblHintA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Height: =22
            Size: =12
            Text: ="出勤狀態欄藍字＝已確認存檔；在右側行政人員輸入選下拉或打字即寫入；資料未更新按右上重新整理"
            Width: =Parent.Width * 0.46
            X: =16
            Y: =50
      - btnRefreshA:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Color: =RGBA(37, 99, 235, 1)
            Fill: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(248, 250, 252, 1)
            OnSelect: =Refresh(AttendanceHistory); ClearCollect(colToday, Filter(AttendanceHistory, 日期 = gToday))
            Size: =13
            Text: ="↻ 重新整理"
            Width: =Parent.Width * 0.20
            X: =Parent.Width - Parent.Width * 0.20 - 16
            Y: =24
      - recHeaderLine:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(229, 231, 235, 1)
            Height: =1
            Width: =Parent.Width
            Y: =83
