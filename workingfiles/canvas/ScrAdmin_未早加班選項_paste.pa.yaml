      - lblNoAccess:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(107, 114, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =80
            Size: =18
            Text: ="你沒有查閱權限"
            Width: =Parent.Width
            Y: =Parent.Height * 0.4
- conDetail:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Height: =Parent.Height
      Visible: =!IsBlank(gDetailEmail)
      Width: =Parent.Width
    Children:
      - recDetailMask:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(15, 23, 42, 0.45)
            Height: =Parent.Height
            OnSelect: =Set(gDetailEmail, Blank())
            Width: =Parent.Width
      - conDetailCard:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: |-
              =Min(
                  Parent.Height * 0.74,
                  92 + CountRows(Filter(colToday, Email = gDetailEmail && 任務名稱 <> Blank())) * 58
              )
            Width: =Parent.Width * 0.62
            X: =Parent.Width * 0.19
            Y: =Parent.Height * 0.12
          Children:
            - lblDetailTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(31, 41, 55, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =14
                  Text: |-
                    =gDetailName & "　今日延遲工作 " &
                     CountRows(Filter(colToday, Email = gDetailEmail && 任務名稱 <> Blank())) & " 件"
                  Width: =Parent.Width - 80
                  X: =20
                  Y: =14
            - btnDetailClose:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(229, 231, 235, 1)
                  BorderThickness: =1
                  Color: =RGBA(107, 114, 128, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =28
                  HoverFill: =RGBA(243, 244, 246, 1)
                  OnSelect: =Set(gDetailEmail, Blank())
                  Size: =12
                  Text: ="✕"
                  Width: =36
                  X: =Parent.Width - 52
                  Y: =16
            - recDetailLine:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(226, 232, 240, 1)
                  Height: =1
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =52
            - galDetail:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Height: =Parent.Height - 68
                  Items: |-
                    =AddColumns(
                        Filter(colToday, Email = gDetailEmail && 任務名稱 <> Blank()),
                        IsRed,
                        EndsWith(Coalesce(Planner狀態, ""), "延遲")
                            && !StartsWith(Coalesce(表單回覆, ""), "2.")
                            && !StartsWith(Coalesce(表單回覆, ""), "4."),
                        IsGreen,
                        StartsWith(Coalesce(表單回覆, ""), "2.")
                            || (!IsBlank(Planner狀態) && !EndsWith(Coalesce(Planner狀態, ""), "延遲")),
                        IsLeave,
                        StartsWith(Coalesce(表單回覆, ""), "4.")
                    )
                  TemplatePadding: =0
                  TemplateSize: =58
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =60
                Children:
                  - recDRow:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: |-
                          =If(
                              ThisItem.IsRed,
                              RGBA(254, 242, 242, 1),
                              If(ThisItem.IsGreen, RGBA(240, 253, 244, 1), RGBA(255, 255, 255, 1))
                          )
                        Height: =Parent.TemplateHeight - 4
                        Width: =Parent.TemplateWidth
                  - lblDTask:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =If(
                              ThisItem.IsRed,
                              RGBA(153, 27, 27, 1),
                              If(
                                  ThisItem.IsGreen,
                                  RGBA(22, 101, 52, 1),
                                  If(ThisItem.IsLeave, RGBA(100, 116, 139, 1), RGBA(31, 41, 55, 1))
                              )
                          )
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =11
                        Text: ="・" & If(IsBlank(ThisItem.方案名稱), "", ThisItem.方案名稱 & "｜") & ThisItem.任務名稱
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.TemplateWidth - 16
                        Wrap: =false
                        X: =8
                        Y: =6
                  - lblDReply:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =If(
                              ThisItem.IsRed,
                              RGBA(185, 28, 28, 1),
                              If(ThisItem.IsLeave, RGBA(100, 116, 139, 1), RGBA(75, 85, 99, 1))
                          )
                        Height: =22
                        Size: =10
                        Text: ="　回覆：" & If(IsBlank(ThisItem.表單回覆), "（未回覆）", ThisItem.表單回覆)
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.TemplateWidth * 0.68
                        Wrap: =false
                        X: =8
                        Y: =28
                  - lblDStat:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: |-
                          =If(
                              ThisItem.IsRed,
                              RGBA(220, 38, 38, 1),
                              If(ThisItem.IsGreen, RGBA(22, 101, 52, 1), RGBA(148, 163, 184, 1))
                          )
                        FontWeight: =If(ThisItem.IsRed, FontWeight.Bold, FontWeight.Normal)
                        Height: =22
                        Size: =10
                        Text: =Coalesce(ThisItem.Planner狀態, "（尚未巡檢）")
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.TemplateWidth * 0.28
                        Wrap: =false
                        X: =Parent.TemplateWidth * 0.70
                        Y: =28
                  - recDDivider:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(241, 245, 249, 1)
                        Height: =1
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
