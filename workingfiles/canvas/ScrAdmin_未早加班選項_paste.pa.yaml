- lblEmptyA:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =RGBA(156, 163, 175, 1)
      Height: =60
      Size: =15
      Text: ="查無同事名冊（請確認 team_member 已連接）"
      Visible: =locIsAdmin And CountRows(galPeople.AllItems) = 0
      Width: =Parent.Width - 32
      X: =16
      Y: =Parent.Height * 0.35
- galPeople:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Height: =Parent.Height - 116
      Items: |-
        =With(
            {
                src: AddColumns(
                    Sort(team_member, 員工編號) As tm,
                    CurStatus,
                    LookUp(colToday, Email = tm.Email).實際出勤狀態,
                    NeedLeaveCard,
                    CountRows(Filter(colToday, Email = tm.Email && StartsWith(表單回覆, "3."))) > 0,
                    HasTask,
                    CountRows(Filter(colToday, Email = tm.Email && 任務名稱 <> Blank())) > 0,
                    TaskCnt,
                    CountRows(Filter(colToday, Email = tm.Email && 任務名稱 <> Blank())),
                    HasPlanStat,
                    CountRows(
                        Filter(
                            colToday,
                            Email = tm.Email && 任務名稱 <> Blank() && !IsBlank(Planner狀態)
                        )
                    ) > 0,
                    PlanDelay,
                    CountRows(
                        Filter(
                            colToday,
                            Email = tm.Email && 任務名稱 <> Blank() && EndsWith(Planner狀態, "延遲")
                        )
                    ) > 0,
                    EarlyOT,
                    CountRows(
                        Filter(
                            colToday,
                            Email = tm.Email && 任務名稱 <> Blank() && StartsWith(表單回覆, "2.")
                        )
                    ) > 0,
                    OnLeave,
                    CountRows(
                        Filter(
                            colToday,
                            Email = tm.Email && 任務名稱 <> Blank() && StartsWith(表單回覆, "4.")
                        )
                    ) > 0,
                    NeedFollow,
                    CountRows(
                        Filter(
                            colToday,
                            Email = tm.Email && 任務名稱 <> Blank() && EndsWith(Planner狀態, "延遲")
                                && !StartsWith(表單回覆, "2.") && !StartsWith(表單回覆, "4.")
                        )
                    ) > 0
                )
            },
            ForAll(
                Sequence(CountRows(src)) As s,
                Patch(Index(src, s.Value), { Idx: s.Value })
            )
        )
      TemplatePadding: =0
      TemplateSize: =(Parent.Height - 116) / 25
      Visible: =locIsAdmin
      Width: =Parent.Width
      Y: =116
    Children:
      - recRow:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =If(Mod(ThisItem.Idx, 2) = 0, RGBA(237, 242, 247, 1), RGBA(255, 255, 255, 1))
            Height: =Parent.TemplateHeight
            Width: =Parent.TemplateWidth
      - recDivider:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(226, 232, 240, 1)
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1
      - lblNo:
          Control: Label@2.5.1
          Properties:
            Color: =If(ThisItem.NeedFollow, RGBA(220, 38, 38, 1), RGBA(107, 114, 128, 1))
            Height: =Parent.TemplateHeight
            Size: =6
            Text: =ThisItem.員工編號
            Width: =Parent.TemplateWidth * 0.033
            X: =Parent.TemplateWidth * 0.005
      - lblName:
          Control: Label@2.5.1
          Properties:
            Color: =If(ThisItem.NeedFollow, RGBA(220, 38, 38, 1), RGBA(31, 41, 55, 1))
            FontWeight: =FontWeight.Semibold
            Height: =Parent.TemplateHeight
            Size: =10
            Text: =ThisItem.姓名
            Width: =Parent.TemplateWidth * 0.048
            X: =Parent.TemplateWidth * 0.040
      - lblStatusView:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(
                  ThisItem.NeedFollow,
                  RGBA(220, 38, 38, 1),
                  If(!IsBlank(ThisItem.CurStatus) && ThisItem.CurStatus <> "（待確認）", RGBA(37, 99, 235, 1), RGBA(203, 213, 225, 1))
              )
            FontWeight: =If(!IsBlank(ThisItem.CurStatus) && ThisItem.CurStatus <> "（待確認）", FontWeight.Bold, FontWeight.Normal)
            Height: =Parent.TemplateHeight
            Size: =10
            Text: =If(!IsBlank(ThisItem.CurStatus) && ThisItem.CurStatus <> "（待確認）", ThisItem.CurStatus, "待確認")
            Tooltip: =If(!IsBlank(ThisItem.CurStatus) && ThisItem.CurStatus <> "（待確認）", ThisItem.CurStatus, "待確認")
            Width: =Parent.TemplateWidth * 0.093
            Wrap: =false
            X: =Parent.TemplateWidth * 0.091
      - drpStatus:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            Color: =If(Self.Selected.Value = "（待確認）", RGBA(203, 213, 225, 1), RGBA(31, 41, 55, 1))
            Default: =Coalesce(ThisItem.CurStatus, "（待確認）")
            Height: =Max(Parent.TemplateHeight - 4, 20)
            Items: =["（待確認）", "0930已到", "1000已到", "10:00前已發**", "1000未到，已提醒", "1000未到，已發米米信", "1000未到，請假", "異地(其他縣市)", "已發**先去場館後進公司", "當日休假", "臨時請假", "未早加班，已補請假", "未早加班，通知補請假"]
            Items.Value: =Value
            OnChange: |-
              =If(
                  !IsBlank(Self.Selected.Value)
                      && Self.Selected.Value <> "（待確認）"
                      && Self.Selected.Value <> Coalesce(ThisItem.CurStatus, ""),
                  UpdateIf(
                      AttendanceHistory,
                      Email = ThisItem.Email && 日期 = gToday,
                      {實際出勤狀態: Self.Selected.Value}
                  );
                  If(
                      IsEmpty(Errors(AttendanceHistory)),
                      UpdateIf(colToday, Email = ThisItem.Email, {實際出勤狀態: Self.Selected.Value});
                      If(
                          "未早加班" in Self.Selected.Value,
                          Notify(
                              "⚠ " & ThisItem.姓名 & "：已標記未早加班，本筆會計入下週一的週報。" &
                                  If("通知補請假" in Self.Selected.Value, "請盡快通知本人補請假。", ""),
                              NotificationType.Warning,
                              8000
                          )
                      ),
                      Notify("儲存失敗：" & First(Errors(AttendanceHistory)).Message, NotificationType.Error)
                  )
              )
            Size: =10
            Width: =Parent.TemplateWidth * 0.115
            X: =Parent.TemplateWidth * 0.188
            Y: =2
      - txtNote:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            Color: =RGBA(31, 41, 55, 1)
            Default: |-
              =If(
                  !IsBlank(ThisItem.CurStatus)
                      && IsBlank(LookUp(["（待確認）", "0930已到", "1000已到", "10:00前已發**", "1000未到，已提醒", "1000未到，已發米米信", "1000未到，請假", "異地(其他縣市)", "已發**先去場館後進公司", "當日休假", "臨時請假", "未早加班，已補請假", "未早加班，通知補請假"], Value = ThisItem.CurStatus)),
                  ThisItem.CurStatus,
                  ""
              )
            Height: =Max(Parent.TemplateHeight - 6, 18)
            HintText: ="自訂／未早加班打 @@"
            OnChange: |-
              =If(
                  !IsBlank(Self.Text)
                      && Self.Text <> Coalesce(ThisItem.CurStatus, ""),
                  UpdateIf(
                      AttendanceHistory,
                      Email = ThisItem.Email && 日期 = gToday,
                      {實際出勤狀態: Self.Text}
                  );
                  If(
                      IsEmpty(Errors(AttendanceHistory)),
                      UpdateIf(colToday, Email = ThisItem.Email, {實際出勤狀態: Self.Text}),
                      Notify("儲存失敗：" & First(Errors(AttendanceHistory)).Message, NotificationType.Error)
                  )
              )
            Size: =10
            Tooltip: |-
              ="一般狀況直接打字即可。" & Char(10) &
               "若為「工作延遲、且未於 09:30 到公司早加班」，請以 @@ 開頭，例：" & Char(10) &
               "　@@未早加班，已補請假" & Char(10) &
               "（週報的未早加班件數只採計 @@ 註記，沒填就不會計入）"
            Width: =Parent.TemplateWidth * 0.083
            X: =Parent.TemplateWidth * 0.310
            Y: =3
      - lblReply:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(
                  ThisItem.NeedFollow,
                  RGBA(220, 38, 38, 1),
                  If(
                      ThisItem.HasTask && (ThisItem.EarlyOT || (ThisItem.HasPlanStat && !ThisItem.PlanDelay)),
                      RGBA(22, 101, 52, 1),
                      RGBA(75, 85, 99, 1)
                  )
              )
            Height: =Parent.TemplateHeight
            OnSelect: |-
              =If(
                  ThisItem.TaskCnt > 0,
                  Set(gDetailEmail, ThisItem.Email);
                  Set(gDetailName, ThisItem.姓名)
              )
            Size: =10
            Text: |-
              =If(
                  ThisItem.TaskCnt = 0,
                  "—",
                  With(
                      {f: First(Filter(colToday, Email = ThisItem.Email && 任務名稱 <> Blank()))},
                      ThisItem.TaskCnt & " 件 ▸ " &
                          If(Len(f.任務名稱) > 18, Left(f.任務名稱, 18) & "…", f.任務名稱) &
                          "｜回覆：" & If(IsBlank(f.表單回覆), "（未回覆）", f.表單回覆)
                  )
              )
            Tooltip: =If(ThisItem.TaskCnt = 0, "", "點一下展開全部 " & ThisItem.TaskCnt & " 件")
            Width: =Parent.TemplateWidth * 0.468
            Wrap: =false
            X: =Parent.TemplateWidth * 0.400
      - lblPlanStat:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(
                  ThisItem.NeedFollow,
                  RGBA(220, 38, 38, 1),
                  If(
                      ThisItem.EarlyOT || (ThisItem.HasPlanStat && !ThisItem.PlanDelay),
                      RGBA(22, 101, 52, 1),
                      If(
                          ThisItem.OnLeave,
                          RGBA(100, 116, 139, 1),
                          RGBA(203, 213, 225, 1)
                      )
                  )
              )
            FontWeight: =If(ThisItem.NeedFollow, FontWeight.Bold, FontWeight.Normal)
            Height: =Parent.TemplateHeight
            Size: =10
            Text: |-
              =If(
                  !ThisItem.HasTask,
                  "—",
                  If(
                      ThisItem.NeedFollow,
                      "仍有延遲",
                      If(
                          ThisItem.EarlyOT,
                          "已早加班",
                          If(
                              ThisItem.OnLeave,
                              "已請假",
                              If(ThisItem.HasPlanStat, "已更新", "未巡檢")
                          )
                      )
                  )
              )
            Tooltip: |-
              =With(
                  {d: Filter(colToday, Email = ThisItem.Email && 任務名稱 <> Blank())},
                  If(
                      CountRows(d) = 0,
                      "（今日無延遲工作）",
                      Concat(d, "・" & 任務名稱 & "：" & If(IsBlank(Planner狀態), "（尚未巡檢）", Planner狀態), Char(10))
                  )
              )
            Width: =Parent.TemplateWidth * 0.120
            Wrap: =false
            X: =Parent.TemplateWidth * 0.875
- conNoAccess:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      Height: =Parent.Height
      Visible: =!IsBlank(locIsAdmin) && Not(locIsAdmin)
