# 基準：2026-08-28 使用者從 Studio 匯出的現行版本（ScrAdmin_0828bak.yaml），控件結構未動。
# 手動畫面屬性（Studio 內手動設，此檔貼不出這段，貼上後須確認仍在）：
#   Screen.OnVisible = Set(gToday, Text(Today(), "yyyy/mm/dd"));
#     UpdateContext({locIsAdmin: Trim(Coalesce(LookUp(team_member, Lower(Email) = Lower(User().Email), '出勤存取權限'), "")) = "行政管理"});
#     ClearCollect(colToday, Filter(AttendanceHistory, 日期 = gToday))
# 用法：畫布全選現有控件 → 刪除 → 貼上本檔（Cmd/Ctrl+V）→ 確認 OnVisible 仍在。
#
# 2026-08-28 本次改動（[Claude@Mac]，共三處，其餘與匯出檔位元完全相同）：
#   ① drpStatus.Items 加兩個選項：「未早加班，已補請假」「未早加班，通知補請假」（共 13 項）。
#   ② txtNote.Default 的 LookUp 清單同步加同兩項 ── 這是必須的連動：
#      該清單用來判斷「CurStatus 是不是自訂文字」，沒同步的話選了新選項後
#      下拉與自訂文字框會同時顯示同一個值。
#   ③ drpStatus.OnChange 存檔成功後，選到的值含「未早加班」即跳 NotificationType.Warning（8 秒）；
#      值再含「通知補請假」時，訊息再附一句「請盡快通知本人補請假。」
#      寫入失敗分支維持原樣不動。
#
# 與流程端的契約（1030 週報 v4）：
#   週報的「未早加班」件數＝ field_7 前綴「3.」 或 field_8 含「未早加班」 或 field_8 以 @@ 開頭。
#   兩個新選項都靠「未早加班」四個字被認出，**這四個字不可拿掉**；後半段文字可自由調整。
#
# 尚未處理（待 PO 決定，本檔刻意未改）：
#   txtNote 的 HintText「自訂／未早加班打 @@」與 Tooltip 仍在教行政打 @@，與新的下拉選項機制並存。
#   @@ 在流程端仍相容認得，不會壞；但文字會誤導。要改跟我說。
#
- conHeaderA:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(237, 237, 237, 1)
      Height: =84
      Visible: =locIsAdmin
      Width: =Parent.Width
    Children:
      - lblTitleA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(31, 41, 55, 1)
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =18
            Text: ="行政出勤查核　" & Text(Today(), "yyyy/mm/dd")
            Width: =Parent.Width * 0.46
            X: =16
            Y: =12
      - lblHintA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Height: =33
            Size: =9
            Text: ="出勤狀態欄藍字＝已確認存檔；整列紅字＝卡片仍延遲、未早加班也非請假，需人工追蹤；資料未更新請按右上重新整理"
            Width: =902
            X: =16
            Y: =50
      - btnRefreshA:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Color: =RGBA(37, 99, 235, 1)
            Fill: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(248, 250, 252, 1)
            OnSelect: =Refresh(AttendanceHistory); ClearCollect(colToday, Filter(AttendanceHistory, 日期 = gToday))
            Size: =13
            Text: ="↻ 重新整理"
            Width: =Parent.Width * 0.20
            X: =Parent.Width - Parent.Width * 0.20 - 16
            Y: =24
      - recHeaderLine:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(229, 231, 235, 1)
            Height: =1
            Width: =Parent.Width
            Y: =83
