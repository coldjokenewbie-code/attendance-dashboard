# 基準：2026-08-03 使用者從 Studio 匯出的現用版本（ScrAdmin_0803bak.yaml），已含 07-31 的 Wrap/Tooltip 截斷修法。
#
# 手動畫面屬性（Studio 內手動設，此檔貼不出這段，貼上後必補）：
#   Screen.OnVisible =
#     Set(gToday, Text(Today(), "yyyy/mm/dd"));
#     UpdateContext({locIsAdmin: Trim(Coalesce(LookUp(team_member, Lower(Email) = Lower(User().Email), '出勤存取權限'), "")) = "行政管理"});
#     ClearCollect(colToday, Filter(AttendanceHistory, 日期 = gToday))
# 用法：畫布全選現有控件 → 刪除 → 貼上本檔（Cmd/Ctrl+V）→ 補回 OnVisible。
#
# ── 2026-08-03 本次改動：新增「Planner 狀態」欄 + 需追蹤列紅字 ──────────────
# ① galPeople.Items 的 AddColumns 新增四個計算欄：
#      HasTask      今天是否有延遲工作列
#      HasPlanStat  Planner 狀態欄是否已被巡檢流程寫入（用來區分「已更新」與「還沒巡檢」——
#                   欄位剛建立時值全空，若不判斷會整頁誤顯示「已更新」）
#      PlanDelay    今天任一延遲工作列的 Planner 狀態為「延遲」
#      NeedFollow   ★需人工追蹤★＝PlanDelay 為真，且該筆回覆為 1./5./未回覆
#    NeedLeaveCard 的比對由全文改為前綴 "3."（選項文字 08-03 由「請填寫假卡」改為「待填寫假卡」，
#    全文比對會靜默失效；前綴比對日後再改字也不會壞）。
# ② 表頭與資料列各加一欄「Planner狀態」，「今日延遲工作｜同事回覆」欄寬 0.465 → 0.375 讓出位置。
# ③ 整列（編號／同事／出勤狀態／回覆內容）文字色改由 NeedFollow 驅動：需追蹤＝紅字。
#    原本由 NeedLeaveCard（勾 3 待填假卡）驅動的紅字已移除，避免兩種紅字並存無法區分；
#    NeedLeaveCard 欄位保留在資料層供日後使用。
# ④ Planner狀態欄自身配色：需追蹤＝紅／延遲但已說明（勾 2、3、4）＝橘／已更新＝綠／今日無延遲工作＝灰。
# ⑤ txtNote（行政自訂輸入框）提示文字：HintText「自訂」→「自訂／未早加班打 @@」，
#    並加 Tooltip 說明完整規則。@@ 是少數事件（至 2026-08-04 尚未發生過），不做下拉選項，只做提示。
#    背景：1030 週報的「未早加班」件數只採計 field_8 以 @@ 開頭的列（PO 2026-08-04 定案，口徑 1），
#    行政沒填就不會計入。流程端的判定已含全形／半形／空格容錯，行政打 ＠＠ 或中間有空格都認得。
#
# ⚠ 欄位名稱：App 端的 SharePoint 欄位用「顯示名」，流程端用「內部名」（PlannerStatus），兩者不同層。
#    本檔公式一律寫 'Planner狀態'（顯示名）。若 Studio 報「名稱無效」，代表該欄顯示名仍是英文，
#    把本檔中全部 'Planner狀態' 換成 PlannerStatus（不加單引號）即可。
#
# 2026-07-31 既有改動（長文字跨列重疊，已上線）：
#   列高寫死 (Parent.Height - 116) / 25、Label 的 Height 等於列高，文字換行即溢出到相鄰列。
#   修法＝lblReply 分隔符改全形「／」串成一行 + Wrap: =false + Tooltip 保留多行全文；
#   lblStatusView 同樣 Wrap: =false + Tooltip。代價：行政頁只能桌機用（手機沒有滑鼠停留）。

- conHeaderA:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(237, 237, 237, 1)
      Height: =84
      Visible: =locIsAdmin
      Width: =Parent.Width
    Children:
      - lblTitleA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(31, 41, 55, 1)
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =18
            Text: ="行政出勤查核　" & Text(Today(), "yyyy/mm/dd")
            Width: =Parent.Width * 0.46
            X: =16
            Y: =12
      - lblHintA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Height: =33
            Size: =12
            Text: ="出勤狀態欄藍字＝已確認存檔；整列紅字＝卡片仍延遲且同事回覆 1／5／未回覆，需人工追蹤；資料未更新按右上重新整理"
            Width: =902
            X: =16
            Y: =50
      - btnRefreshA:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Color: =RGBA(37, 99, 235, 1)
            Fill: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(248, 250, 252, 1)
            OnSelect: =Refresh(AttendanceHistory); ClearCollect(colToday, Filter(AttendanceHistory, 日期 = gToday))
            Size: =13
            Text: ="↻ 重新整理"
            Width: =Parent.Width * 0.20
            X: =Parent.Width - Parent.Width * 0.20 - 16
            Y: =24
      - recHeaderLine:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(229, 231, 235, 1)
            Height: =1
            Width: =Parent.Width
            Y: =83
